<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>限界就活ライフ 〜入学から内定まで〜</title>
<style>
  /* ===== 色の設定（ここを変えると配色が変わります） ===== */
  :root {
    --navy: #1b2a49;
    --navy-light: #2c3e66;
    --white: #ffffff;
    --bg: #eef1f6;
    --gray: #6b7385;
    --gold: #c9a227;
    --plus: #1f7a4d;
    --minus: #b3372f;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    background: var(--bg);
    color: var(--navy);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 16px;
  }

  .card {
    width: 100%;
    max-width: 460px;
    background: var(--white);
    border-radius: 12px;
    box-shadow: 0 6px 24px rgba(27, 42, 73, 0.15);
    overflow: hidden;
    margin: auto 0;
  }
  .card-header {
    background: var(--navy);
    color: var(--white);
    padding: 10px 16px;
    font-size: 12px;
    letter-spacing: 0.15em;
    text-align: center;
  }

  .screen {
    display: none;
    padding: 28px 22px 28px;
    text-align: center;
    min-height: 440px;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }
  .screen.top { justify-content: flex-start; }
  .screen.active { display: flex; }

  /* ===== タイトル ===== */
  .title-sub { font-size: 13px; color: var(--gray); letter-spacing: 0.2em; }
  .title-main { font-size: 30px; line-height: 1.4; font-weight: 800; }
  .title-line { width: 60px; height: 4px; background: var(--gold); border-radius: 2px; }
  .title-note { font-size: 13px; color: var(--gray); line-height: 1.7; }

  /* ===== ボタン ===== */
  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 700;
    padding: 14px 24px;
    width: 100%;
    max-width: 340px;
    transition: transform 0.1s, opacity 0.2s, background 0.2s;
  }
  button:active { transform: scale(0.97); }
  .btn-primary { background: var(--navy); color: var(--white); }
  .btn-primary:hover { background: var(--navy-light); }
  .btn-outline { background: var(--white); color: var(--navy); border: 2px solid var(--navy); }
  .btn-x { background: #000; color: var(--white); }

  /* ===== 入学手続き ===== */
  .setup-title { font-size: 20px; font-weight: 800; }
  .group { width: 100%; text-align: left; }
  .group h3 { font-size: 13px; color: var(--gray); margin-bottom: 8px; }
  .chips { display: flex; flex-direction: column; gap: 8px; }
  .chip {
    background: var(--white);
    color: var(--navy);
    border: 2px solid #cfd6e4;
    text-align: left;
    padding: 10px 14px;
    font-size: 14px;
    max-width: none;
  }
  .chip.selected { border-color: var(--navy); background: var(--navy); color: var(--white); }
  .small-note { font-size: 11px; color: var(--gray); line-height: 1.6; }

  /* ===== ステータス ===== */
  .stats {
    width: 100%;
    background: var(--bg);
    border-radius: 8px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .stat { display: grid; grid-template-columns: 62px 1fr 30px; gap: 8px; align-items: center; font-size: 12px; text-align: left; }
  .bar { height: 8px; background: #dde2ec; border-radius: 4px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--navy); transition: width 0.5s; }
  .stat b { text-align: right; font-variant-numeric: tabular-nums; }

  /* ===== イベント ===== */
  .event-head { width: 100%; display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
  .when { background: var(--navy); color: var(--white); padding: 4px 12px; border-radius: 999px; font-weight: 700; }
  .step { color: var(--gray); }
  .dots { width: 100%; display: flex; gap: 4px; }
  .dots i { flex: 1; height: 4px; border-radius: 2px; background: #dde2ec; }
  .dots i.done { background: var(--navy); }
  .question { font-size: 18px; font-weight: 800; line-height: 1.6; text-align: left; width: 100%; }
  .choices { width: 100%; display: flex; flex-direction: column; gap: 10px; }
  .choice {
    background: var(--white);
    color: var(--navy);
    border: 2px solid var(--navy);
    text-align: left;
    padding: 12px 14px;
    font-size: 15px;
    max-width: none;
  }
  .choice:hover { background: var(--bg); }
  .choice.picked { background: var(--navy); color: var(--white); }
  .choice.dim { opacity: 0.35; pointer-events: none; }

  .outcome {
    width: 100%;
    background: #fff8dc;
    border-left: 5px solid var(--gold);
    border-radius: 6px;
    padding: 12px 14px;
    text-align: left;
    font-size: 15px;
    line-height: 1.7;
    animation: pop 0.3s ease;
  }
  .deltas { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .d { font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: var(--white); }
  .d.plus { color: var(--plus); border: 1px solid var(--plus); }
  .d.minus { color: var(--minus); border: 1px solid var(--minus); }

  /* ===== ガチャ演出 ===== */
  .stage-text { font-size: 24px; font-weight: 800; min-height: 40px; animation: pop 0.25s ease; }
  @keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .progress { width: 100%; max-width: 280px; height: 8px; background: #dde2ec; border-radius: 4px; overflow: hidden; }
  .progress-bar { height: 100%; width: 0%; background: var(--navy); transition: width 0.5s linear; }
  .spinner { width: 44px; height: 44px; border: 5px solid #dde2ec; border-top-color: var(--navy); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== 結果 ===== */
  .rarity { display: inline-block; padding: 6px 20px; border-radius: 999px; font-weight: 800; font-size: 16px; letter-spacing: 0.1em; color: var(--white); }
  .rarity-UR { background: linear-gradient(135deg, #e0b500, #ff7a00); }
  .rarity-SR { background: linear-gradient(135deg, #8a8fa3, #c5cad8); color: var(--navy); }
  .rarity-R  { background: #3b7dd8; }
  .rarity-N  { background: #6b7385; }
  .result-title { font-size: 24px; font-weight: 800; line-height: 1.4; }
  .result-box { width: 100%; background: var(--bg); border-left: 5px solid var(--navy); border-radius: 6px; padding: 14px; font-size: 15px; line-height: 1.8; text-align: left; }
  .result-box.ur { border-left-color: var(--gold); background: #fff8dc; }
  .comment { width: 100%; font-size: 13px; line-height: 1.7; text-align: left; color: var(--navy-light); }
  .buttons { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .screen.ur-glow { animation: glow 1.2s ease-in-out 3; }
  @keyframes glow { 0%, 100% { background: var(--white); } 50% { background: #fff4c2; } }

  /* ===== 100回シミュレーション ===== */
  .sim { width: 100%; background: var(--bg); border-radius: 8px; padding: 12px; text-align: left; animation: pop 0.3s ease; }
  .sim h4 { font-size: 14px; margin-bottom: 8px; }
  .sim-row { display: grid; grid-template-columns: 34px 1fr 44px; gap: 8px; align-items: center; font-size: 12px; margin-bottom: 6px; }
  .sim-row b { font-variant-numeric: tabular-nums; text-align: right; }
  .sim .bar > i.UR { background: linear-gradient(90deg, #e0b500, #ff7a00); }
  .sim .bar > i.SR { background: #8a8fa3; }
  .sim .bar > i.R { background: #3b7dd8; }
  .sim .bar > i.N { background: #6b7385; }
  .sim .rate { margin-top: 8px; font-size: 14px; font-weight: 800; }
  [hidden] { display: none !important; }
</style>
</head>

<div class="card">
  <div class="card-header">RECRUIT ENTRY SHEET</div>

  <!-- タイトル -->
  <section id="screen-title" class="screen">
    <p class="title-sub">〜 入学から内定まで 〜</p>
    <h1 class="title-main">限界就活<br>ライフ</h1>
    <div class="title-line"></div>
    <p class="title-note">4年間の選択が、就活の運命を変える。<br>所要時間は約5分。</p>
    <button class="btn-primary" id="btn-start">入学手続きをする</button>
  </section>

  <!-- 入学手続き -->
  <section id="screen-setup" class="screen top">
    <h2 class="setup-title">入学手続き</h2>
    <div class="group">
      <h3>入学する大学</h3>
      <div class="chips" id="chips-univ">
        <button class="chip" data-value="S">最難関クラスの大学</button>
        <button class="chip" data-value="A">難関クラスの大学</button>
        <button class="chip" data-value="B">中堅クラスの大学</button>
        <button class="chip" data-value="C">のびしろ大学</button>
        <button class="chip selected" data-value="random">おまかせ（くじ）</button>
      </div>
    </div>
    <div class="group">
      <h3>実家の環境</h3>
      <div class="chips" id="chips-family">
        <button class="chip" data-value="rich">実家が太い</button>
        <button class="chip" data-value="normal">ふつうの家庭</button>
        <button class="chip" data-value="poor">奨学金とバイト頼み</button>
        <button class="chip selected" data-value="random">おまかせ（くじ）</button>
      </div>
    </div>
    <p class="small-note">※大学ランクや数値はゲーム用の架空の目安で、現実の統計ではありません。</p>
    <button class="btn-primary" id="btn-enter">入学する</button>
  </section>

  <!-- イベント -->
  <section id="screen-event" class="screen top">
    <div class="event-head"><span class="when" id="ev-when"></span><span class="step" id="ev-step"></span></div>
    <div class="dots" id="ev-dots"></div>
    <div class="stats" id="ev-stats"></div>
    <p class="question" id="ev-question"></p>
    <div class="choices" id="ev-choices"></div>
    <div id="ev-outcome" hidden></div>
    <button class="btn-primary" id="btn-next" hidden>次へ</button>
  </section>

  <!-- 選考演出 -->
  <section id="screen-gacha" class="screen">
    <div class="spinner"></div>
    <p class="stage-text" id="stage-text">エントリーシート提出</p>
    <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
  </section>

  <!-- 結果 -->
  <section id="screen-result" class="screen top">
    <span class="rarity" id="result-rarity"></span>
    <h2 class="result-title" id="result-title"></h2>
    <div class="result-box" id="result-box"></div>
    <p class="comment" id="result-comment"></p>
    <div class="stats" id="result-stats"></div>
    <div class="sim" id="sim-box" hidden></div>
    <div class="buttons">
      <button class="btn-primary" id="btn-retry">もう一度就活する</button>
      <button class="btn-outline" id="btn-sim">この人生で就活を100回やる</button>
      <button class="btn-x" id="btn-share">X（旧Twitter）で結果をシェアする</button>
    </div>
  </section>
</div>

function clamp(v) { return Math.max(0, Math.min(100, v)); }

// 入学時のステータスを作る
function newState(univKey, famKey) {
  return {
    univ: univKey,
    family: famKey,
    gaku: UNIV[univKey].gaku,
    comu: 35,
    gakuchika: 20,
    tairyoku: 60,
    money: FAMILY[famKey].money
  };
}

// 確率に従って結果を1つ選ぶ
function pickOutcome(choice) {
  let r = Math.random();
  for (const o of choice.outcomes) {
    if (r < o.p) return o;
    r -= o.p;
  }
  return choice.outcomes[choice.outcomes.length - 1];
}

// 能力値を増減し、実際に変わった量を返す
function applyFx(st, fx) {
  const delta = {};
  for (const k in fx) {
    const before = st[k];
    st[k] = clamp(before + fx[k]);
    delta[k] = st[k] - before;
  }
  return delta;
}

// 就活力（運を足す前の実力）
function baseScore(st) {
  let b = 0.28 * st.gaku + 0.22 * st.comu + 0.24 * st.gakuchika +
          0.08 * st.tairyoku + 0.04 * st.money + UNIV[st.univ].bonus;
  if (st.tairyoku <= 15) b -= 8; // 体力が尽きていると面接で不利
  return b;
}

// 選考1回分の抽選（実力＋運）。しきい値を変えると出やすさが変わります
const TH_UR = 76, TH_SR = 62, TH_R = 46;
function rollOutcome(st) {
  const luck = (Math.random() + Math.random() + Math.random() - 1.5) * 26;
  const s = baseScore(st) + luck;
  if (s >= TH_UR) return "UR";
  if (s >= TH_SR) return "SR";
  if (s >= TH_R) return "R";
  return "N";
}

// 同じ人生で n 回就活する
function simulate(st, n) {
  const c = { UR: 0, SR: 0, R: 0, N: 0 };
  for (let i = 0; i < n; i++) c[rollOutcome(st)]++;
  return c;
}

function setupChips(groupId, key) {
  const box = $(groupId);

    selected[key] = btn.dataset.value;

function pickRandomKey(obj) {
  const keys = Object.keys(obj);
  return keys[Math.floor(Math.random() * keys.length)];
}

  const u = selected.univ === "random" ? pickRandomKey(UNIV) : selected.univ;
  const f = selected.family === "random" ? pickRandomKey(FAMILY) : selected.family;
  state = newState(u, f);

// ----- イベント -----
function showEvent() {
  const ev = EVENTS[eventIndex];
  showScreen("event");
  $("ev-when").textContent = ev.when;
  $("ev-step").textContent = (eventIndex + 1) + " / " + EVENTS.length;
  $("ev-dots").innerHTML = EVENTS.map((_, i) => '<i class="' + (i < eventIndex ? "done" : "") + '"></i>').join("");
  renderStats($("ev-stats"), state);
  $("ev-question").textContent = ev.q;
  $("ev-outcome").hidden = true;
  $("btn-next").hidden = true;

  const box = $("ev-choices");
  box.innerHTML = "";
  ev.choices.forEach((c, i) => {
    const b = document.createElement("button");
    b.className = "choice";
    b.textContent = c.label;
    b.addEventListener("click", () => choose(i));
    box.appendChild(b);
  });
}

function choose(i) {
  const ev = EVENTS[eventIndex];
  const outcome = pickOutcome(ev.choices[i]);
  const delta = applyFx(state, outcome.fx);

  document.querySelectorAll("#ev-choices .choice").forEach((b, idx) => {
    b.classList.add(idx === i ? "picked" : "dim");
  });

  const chips = Object.keys(delta).filter((k) => delta[k] !== 0).map((k) => {
    const v = delta[k];
    return '<span class="d ' + (v > 0 ? "plus" : "minus") + '">' + STAT_NAMES[k] + " " + (v > 0 ? "+" : "") + v + "</span>";
  }).join("");
  const out = $("ev-outcome");
  out.innerHTML = '<div class="outcome">' + outcome.text + '<div class="deltas">' + chips + "</div></div>";
  out.hidden = false;
  renderStats($("ev-stats"), state);

  const last = eventIndex === EVENTS.length - 1;
  $("btn-next").textContent = last ? "就活本番へ進む" : "次へ";
  $("btn-next").hidden = false;
}

function next() {
  if (eventIndex === EVENTS.length - 1) { startSelection(); return; }
  eventIndex++;
  showEvent();
}

function startSelection() {
  showScreen("gacha");

  const text = $("stage-text");
  let i = 0;
  bar.style.transition = "none";
  bar.style.width = "0%";
  text.textContent = STAGES[0];
  setTimeout(() => {
    bar.style.transition = "width " + (STAGE_MS / 1000) + "s linear";
    bar.style.width = (1 / STAGES.length * 100) + "%";
  }, 30);
  const timer = setInterval(() => {
    i++;
    if (i >= STAGES.length) {
      clearInterval(timer);
      bar.style.width = "100%";
      setTimeout(showResult, 400);
      return;
    }
    text.textContent = STAGES[i];
    text.style.animation = "none";
    void text.offsetWidth;
    text.style.animation = "";
    bar.style.width = ((i + 1) / STAGES.length * 100) + "%";
  }, STAGE_MS);
}

function makeComment(st) {
  const keys = ["gaku", "comu", "gakuchika", "tairyoku"];
  const sorted = keys.slice().sort((a, b) => st[b] - st[a]);
  const high = {
    gaku: "学力の高さが武器になった4年間でした。",
    comu: "コミュ力の高さが面接官に刺さりました。",
    gakuchika: "ガクチカの厚みが最大の強みでした。",
    tairyoku: "体力と安定感が光る就活でした。"

  const low = {

    comu: "もう少し人と話す経験があれば…。",
    gakuchika: "ガクチカが薄めだったのが惜しいところです。",
    tairyoku: "体力が尽きかけていたのが気がかりです。"
  };
  return high[sorted[0]] + low[sorted[sorted.length - 1]] +
         "（" + UNIV[st.univ].name + "／" + FAMILY[st.family].name + "）";
}

  box.innerHTML = "<h4>この人生で就活を100回やると…</h4>" + rows +
    '<p class="rate">内定率：' + offer + "%</p>" +
    '<p class="small-note">※ゲーム上の架空の計算結果で、現実の統計ではありません。</p>';
  box.hidden = false;
  box.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

// ----- Xでシェア -----
function shareOnX() {
  const mark = currentResult.rank === "N" ? "😭" : "🎉";
  let text = "【限界就活ライフ】入学から就活までの結果は【" + currentResult.rank + "】" +
             currentResult.title + " " + mark;
  if (lastSim) {
    text += "\n100回就活したら内定率" + (lastSim.UR + lastSim.SR + lastSim.R) + "%";
  }
  text += "\n#限界就活ライフ";
  const url = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(text) +
    "&url=" + encodeURIComponent(location.href.startsWith("http") ? location.href : "");
  window.open(url, "_blank", "noopener");
}

// ===== ボタンの動作 =====
$("btn-start").addEventListener("click", () => showScreen("setup"));
$("btn-enter").addEventListener("click", startLife);
$("btn-next").addEventListener("click", next);
$("btn-retry").addEventListener("click", () => showScreen("setup"));
$("btn-sim").addEventListener("click", runSim);
$("btn-share").addEventListener("click", shareOnX);

showScreen("title");
</script>
</body>
